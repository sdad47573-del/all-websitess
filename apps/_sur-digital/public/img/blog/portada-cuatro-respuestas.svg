<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="tituloPortada">
  <title id="tituloPortada">La portada en cuatro respuestas</title>
  <rect width="720" height="520" fill="#f7f9fc"/>
  <text x="32" y="62" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1d232a">La portada en cuatro respuestas</text>
  <text x="32" y="94" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#4b5563">Lo que el visitante debe entender en los primeros segundos</text>

  <rect x="32" y="120" width="656" height="88" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="76" cy="164" r="18" fill="#008af9"/>
  <text x="76" y="171" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="108" y="160" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Qué haces</text>
  <text x="108" y="190" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">«Diseño webs para negocios locales»</text>

  <rect x="32" y="220" width="656" height="88" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="76" cy="264" r="18" fill="#008af9"/>
  <text x="76" y="271" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="108" y="260" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Para quién</text>
  <text x="108" y="290" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Restaurantes, clínicas y talleres</text>

  <rect x="32" y="320" width="656" height="88" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="76" cy="364" r="18" fill="#f9a23f"/>
  <text x="76" y="371" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="108" y="360" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Dónde</text>
  <text x="108" y="390" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Málaga y Costa del Sol</text>

  <rect x="32" y="420" width="656" height="88" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="76" cy="464" r="18" fill="#f9a23f"/>
  <text x="76" y="471" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="108" y="460" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Qué hacer</text>
  <text x="108" y="490" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Ver precios, pedir cita o llamar</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="tituloContacto">
  <title id="tituloContacto">Qué pasa después del formulario</title>
  <rect width="720" height="470" fill="#f7f9fc"/>
  <text x="32" y="62" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1d232a">Qué pasa después del formulario</text>

  <line x1="72" y1="100" x2="72" y2="392" stroke="#c7d2e0" stroke-width="3"/>

  <circle cx="72" cy="132" r="12" fill="#008af9"/>
  <text x="104" y="124" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Contacto</text>
  <text x="104" y="154" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Llega por web o WhatsApp</text>

  <circle cx="72" cy="212" r="12" fill="#008af9"/>
  <text x="104" y="204" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Menos de 24 h</text>
  <text x="104" y="234" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Respuesta con hora concreta</text>

  <circle cx="72" cy="292" r="12" fill="#f9a23f"/>
  <text x="104" y="284" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Día 2</text>
  <text x="104" y="314" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Recordatorio breve</text>

  <circle cx="72" cy="372" r="12" fill="#f9a23f"/>
  <text x="104" y="364" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1d232a">Día 7</text>
  <text x="104" y="394" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Última pregunta útil</text>

  <text x="32" y="440" font-family="system-ui, sans-serif" font-size="20" fill="#4b5563">Dos seguimientos y después, silencio.</text>
</svg>

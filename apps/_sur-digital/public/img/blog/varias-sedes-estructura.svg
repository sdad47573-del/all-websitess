<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="tituloSedes">
  <title id="tituloSedes">Una web con una página por sede</title>
  <rect width="720" height="440" fill="#f7f9fc"/>
  <text x="32" y="62" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1d232a">Una web, una página por sede</text>

  <rect x="270" y="92" width="180" height="56" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="360" y="128" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1d232a" text-anchor="middle">Inicio</text>

  <line x1="360" y1="148" x2="360" y2="180" stroke="#9fb3c8" stroke-width="3"/>
  <rect x="250" y="180" width="220" height="56" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="360" y="216" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1d232a" text-anchor="middle">Selector de sede</text>

  <path d="M360 236 V258 H200 V282" fill="none" stroke="#9fb3c8" stroke-width="3"/>
  <path d="M360 258 H520 V282" fill="none" stroke="#9fb3c8" stroke-width="3"/>
  <rect x="90" y="282" width="220" height="56" rx="12" fill="#ffffff" stroke="#008af9" stroke-width="2"/>
  <text x="200" y="318" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0057a8" text-anchor="middle">/sedes/centro/</text>
  <rect x="410" y="282" width="220" height="56" rx="12" fill="#ffffff" stroke="#008af9" stroke-width="2"/>
  <text x="520" y="318" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0057a8" text-anchor="middle">/sedes/teatinos/</text>

  <text x="360" y="382" font-family="system-ui, sans-serif" font-size="21" fill="#4b5563" text-anchor="middle">Cada sede con su dirección, horario y ficha de Google</text>

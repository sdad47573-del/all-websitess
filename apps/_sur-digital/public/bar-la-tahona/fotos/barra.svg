<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#254437"/>
      <stop offset="1" stop-color="#16241c"/>
    </linearGradient>
    <linearGradient id="bWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96612f"/>
      <stop offset=".4" stop-color="#7b4c25"/>
      <stop offset="1" stop-color="#593717"/>
    </linearGradient>
    <linearGradient id="bTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1e2"/>
      <stop offset="1" stop-color="#e3d5ba"/>
    </linearGradient>
    <linearGradient id="bBeer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c266"/>
      <stop offset="1" stop-color="#c17f28"/>
    </linearGradient>
    <linearGradient id="bMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9b3a4"/>
      <stop offset=".45" stop-color="#f2ede1"/>
      <stop offset="1" stop-color="#8d887c"/>
    </linearGradient>
    <radialGradient id="bLamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd68c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd68c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12201a"/>
      <stop offset="1" stop-color="#0b1511"/>
    </linearGradient>
  </defs>


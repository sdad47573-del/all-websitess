<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="dTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset=".55" stop-color="#f0e7d3"/>
      <stop offset="1" stop-color="#e0d1b4"/>
    </linearGradient>
    <linearGradient id="dPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="dBread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c08a"/>
      <stop offset="1" stop-color="#c99356"/>
    </linearGradient>
    <linearGradient id="dCoffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b48a"/>
      <stop offset=".45" stop-color="#9a6a3f"/>
      <stop offset="1" stop-color="#6a4423"/>
    </linearGradient>
    <linearGradient id="dJuice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b74a"/>
      <stop offset="1" stop-color="#d9822a"/>
    </linearGradient>
    <linearGradient id="dSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#dTop)"/>
  <path d="M0 0 L1000 0 L1000 640 L0 900 Z" fill="url(#dSun)"/>
  <g opacity=".13">
    <path d="M0 330 H1000" stroke="#b85a36" stroke-width="4"/>
    <path d="M0 640 H1000" stroke="#b85a36" stroke-width="4"/>
    <path d="M240 0 V1000 M620 0 V1000" stroke="#b85a36" stroke-width="4"/>
  </g>

  <!-- plato con tostada -->
  <g>
    <circle cx="352" cy="392" r="212" fill="#000" opacity=".08"/>
    <circle cx="346" cy="384" r="206" fill="url(#dPlate)"/>
    <circle cx="346" cy="384" r="172" fill="none" stroke="#e7dbc4" stroke-width="6"/>
    <g transform="rotate(-8 348 380)">
      <rect x="212" y="292" width="272" height="176" rx="26" fill="url(#dBread)"/>
      <rect x="228" y="306" width="240" height="148" rx="20" fill="#f3e3c6"/>
      <g fill="#bf3a2b" opacity=".92">
        <path d="M244 322 c46-14 92-6 118 12-38 18-92 18-118-12 Z"/>
        <path d="M262 372 c48-12 92-4 118 12-40 16-92 14-118-12 Z"/>
        <path d="M300 420 c44-10 84-2 108 12-36 14-84 12-108-12 Z"/>
      </g>
      <g fill="#e8b64c" opacity=".55">
        <ellipse cx="392" cy="352" rx="26" ry="12"/>
        <ellipse cx="330" cy="404" rx="22" ry="10"/>
      </g>
      <g stroke="#c99a52" stroke-width="4" opacity=".5">
        <path d="M240 440 h150"/>
      </g>
    </g>
  </g>

  <!-- café con leche -->
  <g>
    <ellipse cx="742" cy="470" rx="120" ry="34" fill="#000" opacity=".12"/>
    <ellipse cx="738" cy="452" rx="112" ry="30" fill="#f4ecdc"/>
    <path d="M646 356 h184 l-14 96 H660 Z" fill="#f7f1e4" opacity=".9"/>
    <path d="M656 372 h164 l-10 76 H666 Z" fill="url(#dCoffee)"/>
    <path d="M656 372 h164 l-3 22 H659 Z" fill="#e9d3b4"/>
    <path d="M672 386 h20 l-6 54 h-18 Z" fill="#fff" opacity=".35"/>
    <ellipse cx="738" cy="360" rx="92" ry="20" fill="#fbf5e8"/>
    <ellipse cx="738" cy="358" rx="80" ry="15" fill="#e5c9a1"/>
  </g>

  <!-- zumo -->
  <g>
    <ellipse cx="252" cy="762" rx="94" ry="26" fill="#000" opacity=".11"/>
    <path d="M190 606 h126 l-12 148 H202 Z" fill="#f6f0e2" opacity=".95"/>
    <path d="M200 622 h106 l-9 118 h-88 Z" fill="url(#dJuice)"/>
    <path d="M204 622 h98 l-2 16 h-94 Z" fill="#f9d79a"/>
    <path d="M214 640 h16 l-5 84 h-15 Z" fill="#fff" opacity=".3"/>
    <circle cx="258" cy="596" r="26" fill="#e8962e"/>
    <path d="M258 570 a26 26 0 0 1 25 19 l-25-19 Z" fill="#f7bd63"/>
  </g>

  <!-- cuchara y servilleta -->
  <g transform="rotate(12 612 782)">
    <rect x="560" y="700" width="104" height="26" rx="13" fill="#cfcabd"/>
    <ellipse cx="576" cy="713" rx="30" ry="19" fill="#e3ded1"/>
  </g>
  <g transform="rotate(-8 700 790)">
    <rect x="628" y="742" width="228" height="150" rx="4" fill="#fbf6ea"/>
    <rect x="628" y="742" width="228" height="150" rx="4" fill="none" stroke="#ded0b4" stroke-width="3"/>
    <path d="M650 768 h184 M650 796 h150" stroke="#e7dcc5" stroke-width="3"/>
  </g>

  <!-- migas -->
  <g fill="#d9b072" opacity=".8">
    <circle cx="470" cy="664" r="6"/>
    <circle cx="498" cy="690" r="5"/>
    <circle cx="452" cy="700" r="4"/>
    <circle cx="524" cy="672" r="4"/>
    <circle cx="486" cy="716" r="3"/>
  </g>
</svg>

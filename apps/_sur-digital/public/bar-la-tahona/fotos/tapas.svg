    <rect x="628" y="742" width="250" height="170" rx="4" fill="#fbf6ea"/>
    <rect x="628" y="742" width="250" height="170" rx="4" fill="none" stroke="#ded0b4" stroke-width="3"/>
    <path d="M650 766 h210" stroke="#e7dcc5" stroke-width="3"/>
  </g>

  <!-- plato principal: tortilla de camarones -->
  <g>
    <circle cx="402" cy="500" r="256" fill="#000" opacity=".08"/>
    <circle cx="396" cy="492" r="250" fill="url(#tPlate)"/>
    <circle cx="396" cy="492" r="214" fill="none" stroke="#e6dac3" stroke-width="6"/>

    </g>
    <g fill="#f7d79a" opacity=".7">
      <circle cx="318" cy="430" r="12"/>
      <circle cx="352" cy="472" r="9"/>
      <circle cx="446" cy="432" r="11"/>
      <circle cx="466" cy="500" r="8"/>
      <circle cx="364" cy="600" r="10"/>
      <circle cx="330" cy="562" r="7"/>

    <ellipse cx="190" cy="796" rx="124" ry="58" fill="#d9a766"/>
    <ellipse cx="188" cy="788" rx="110" ry="48" fill="#eac693"/>
    <ellipse cx="330" cy="826" rx="86" ry="42" fill="#000" opacity=".06"/>
    <ellipse cx="324" cy="818" rx="82" ry="40" fill="#d9a766"/>
    <ellipse cx="322" cy="811" rx="70" ry="32" fill="#eac693"/>

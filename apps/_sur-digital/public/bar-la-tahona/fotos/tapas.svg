<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="tTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f2e3"/>
      <stop offset=".55" stop-color="#efe4ce"/>
      <stop offset="1" stop-color="#e2d3b7"/>
    </linearGradient>
    <linearGradient id="tPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="tFry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c266"/>
      <stop offset="1" stop-color="#c9862e"/>
    </linearGradient>
    <linearGradient id="tBeer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0bd5e"/>
      <stop offset="1" stop-color="#bb7923"/>
    </linearGradient>
    <linearGradient id="tLin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b85a36"/>
      <stop offset="1" stop-color="#8f3f22"/>
    </linearGradient>
    <radialGradient id="tLight" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff8e8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#tTop)"/>
  <rect width="1000" height="1000" fill="url(#tLight)"/>

  <!-- mantel de cuadros -->
  <g opacity=".16">
    <path d="M0 250 H1000 M0 420 H1000 M0 590 H1000 M0 760 H1000" stroke="#b85a36" stroke-width="26"/>
    <path d="M180 0 V1000 M380 0 V1000 M580 0 V1000 M780 0 V1000 M980 0 V1000" stroke="#b85a36" stroke-width="26"/>
  </g>

  <!-- servilleta -->

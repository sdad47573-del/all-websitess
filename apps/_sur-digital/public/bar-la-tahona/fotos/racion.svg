<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="rTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1e2"/>
      <stop offset=".5" stop-color="#ede2cb"/>
      <stop offset="1" stop-color="#ddccae"/>
    </linearGradient>
    <linearGradient id="rPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eee4d2"/>
    </linearGradient>
    <linearGradient id="rCod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#ecdfc6"/>
    </linearGradient>
    <linearGradient id="rPot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b45f"/>
      <stop offset="1" stop-color="#c4842f"/>
    </linearGradient>
    <linearGradient id="rWine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e4a8"/>
      <stop offset="1" stop-color="#cdb45c"/>
    </linearGradient>
    <linearGradient id="rMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b0aa9c"/>
      <stop offset=".5" stop-color="#f1ece0"/>
      <stop offset="1" stop-color="#938e82"/>
    </linearGradient>
    <radialGradient id="rLight" cx=".35" cy=".15" r=".85">
      <stop offset="0" stop-color="#fff8e8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#rTop)"/>
  <rect width="1000" height="1000" fill="url(#rLight)"/>
  <g opacity=".12">
    <path d="M0 200 H1000 M0 470 H1000 M0 740 H1000" stroke="#2e6f8e" stroke-width="18"/>
    <path d="M210 0 V1000 M510 0 V1000 M810 0 V1000" stroke="#2e6f8e" stroke-width="18"/>
  </g>

  <!-- plato -->
  <g>
    <ellipse cx="452" cy="500" rx="288" ry="262" fill="#000" opacity=".08"/>
    <ellipse cx="446" cy="490" rx="284" ry="258" fill="url(#rPlate)"/>
    <ellipse cx="446" cy="490" rx="238" ry="214" fill="none" stroke="#e6dac3" stroke-width="7"/>

    <!-- patatas -->
    <g fill="url(#rPot)">
      <ellipse cx="352" cy="392" rx="60" ry="34" transform="rotate(-16 352 392)"/>
      <ellipse cx="512" cy="372" rx="58" ry="32" transform="rotate(12 512 372)"/>
      <ellipse cx="586" cy="486" rx="56" ry="30" transform="rotate(-8 586 486)"/>
      <ellipse cx="356" cy="592" rx="58" ry="32" transform="rotate(14 356 592)"/>
      <ellipse cx="500" cy="614" rx="54" ry="30" transform="rotate(-10 500 614)"/>
      <ellipse cx="430" cy="478" rx="52" ry="28" transform="rotate(20 430 478)"/>
    </g>
    <g fill="#c07f2b" opacity=".5">
      <ellipse cx="356" cy="596" rx="40" ry="14"/>
      <ellipse cx="588" cy="490" rx="36" ry="12"/>
    </g>

    <!-- lomos de bacalao -->
    <g fill="url(#rCod)" stroke="#ddcdb0" stroke-width="4">
      <path d="M320 462 c34-34 88-34 112-4 22 28 10 66-26 78-38 12-78-6-88-38-4-14-2-24 2-36 Z"/>
      <path d="M452 440 c32-32 84-32 108-4 22 26 10 64-24 76-36 12-76-6-86-36-4-14-2-24 2-36 Z"/>
      <path d="M420 556 c30-30 80-30 104-4 22 26 8 62-24 74-34 12-72-6-82-34-4-14-2-22 2-36 Z"/>
    </g>
    <g fill="#fdf8ec" opacity=".9">
      <path d="M336 476 c22-20 58-20 76-2-24 10-56 14-76 2 Z"/>
      <path d="M468 456 c22-18 56-18 74-2-24 10-54 14-74 2 Z"/>
      <path d="M436 572 c20-18 52-18 70-2-22 10-50 14-70 2 Z"/>
    </g>

    <!-- pimientos -->
    <g fill="#b8452f">
      <path d="M540 552 c34-12 72-4 92 14-30 16-72 16-98 2 Z"/>
      <path d="M310 508 c30-10 64-4 82 12-26 14-64 14-88 2 Z"/>
    </g>
    <path d="M596 586 c22-8 44-4 56 8-18 10-44 10-60 2 Z" fill="#3f6b4d"/>

    <!-- aceite -->
    <g fill="#f3e2b0" opacity=".85">
      <circle cx="388" cy="432" r="9"/>
      <circle cx="500" cy="414" r="7"/>
      <circle cx="470" cy="600" r="8"/>
      <circle cx="566" cy="452" r="6"/>
      <circle cx="336" cy="556" r="6"/>
    </g>
    <path d="M540 618 a56 56 0 0 1-56 56 l56-56 Z" fill="#e8cf55"/>
    <path d="M484 618 a56 56 0 0 1 56 56 l-56-56 Z" fill="#f4e281"/>
  </g>

  <!-- tenedor -->
  <g transform="rotate(8 172 560)" fill="url(#rMetal)">
    <rect x="164" y="440" width="16" height="290" rx="8"/>
    <g>
      <rect x="146" y="380" width="10" height="70" rx="5"/>
      <rect x="162" y="380" width="10" height="70" rx="5"/>
      <rect x="178" y="380" width="10" height="70" rx="5"/>
      <rect x="194" y="380" width="10" height="70" rx="5"/>
      <path d="M142 430 h66 v24 h-66 Z"/>
    </g>
  </g>

  <!-- cuchillo -->
  <g transform="rotate(-6 848 566)" fill="url(#rMetal)">
    <rect x="840" y="470" width="18" height="240" rx="8"/>
    <path d="M832 470 c0-70 34-108 34-108 v108 Z"/>
  </g>

  <!-- copa de vino -->
  <g>
    <ellipse cx="812" cy="276" rx="86" ry="24" fill="#000" opacity=".1"/>
    <path d="M760 176 h104 l-8 90 c-2 26-20 42-44 42s-42-16-44-42 Z" fill="#f7f1e4" opacity=".55"/>
    <path d="M768 214 h88 l-6 54 c-2 20-16 32-38 32s-36-12-38-32 Z" fill="url(#rWine)"/>
    <ellipse cx="812" cy="214" rx="44" ry="10" fill="#f6edc4"/>
    <rect x="806" y="308" width="12" height="64" fill="#e6dfd0"/>
    <ellipse cx="812" cy="378" rx="46" ry="10" fill="#e6dfd0"/>
    <path d="M776 186 h20 l-6 50 h-16 Z" fill="#fff" opacity=".35"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="vSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8dd"/>
      <stop offset="1" stop-color="#f2ece0"/>
    </linearGradient>
    <linearGradient id="vWall" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#ece0c9"/>
    </linearGradient>
    <linearGradient id="vCloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset="1" stop-color="#e3d3b2"/>
    </linearGradient>
    <linearGradient id="vFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d5be"/>
      <stop offset="1" stop-color="#c8b699"/>
    </linearGradient>
    <linearGradient id="vWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4713c"/>
      <stop offset="1" stop-color="#6b4620"/>
    </linearGradient>
    <linearGradient id="vSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6df" stop-opacity=".65"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8459"/>
      <stop offset="1" stop-color="#2f4f3d"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#vSky)"/>

  <!-- pared encalada -->
  <rect x="0" y="180" width="1000" height="330" fill="url(#vWall)"/>
  <rect x="0" y="500" width="1000" height="16" fill="#d9c9ad"/>
  <rect x="0" y="180" width="1000" height="12" fill="#e6d8bf"/>
  <g opacity=".35" stroke="#dccdb2" stroke-width="2">
    <path d="M120 204 v276 M420 204 v276 M700 204 v276 M860 204 v276"/>
  </g>

  <!-- puerta y ventana al fondo -->
  <g>
    <rect x="70" y="288" width="150" height="212" fill="#d8c8ab"/>
    <rect x="80" y="298" width="130" height="202" fill="#31604a"/>
    <rect x="86" y="304" width="54" height="86" fill="#3e705a"/>
    <rect x="150" y="304" width="54" height="86" fill="#3e705a"/>
    <rect x="86" y="400" width="54" height="90" fill="#3e705a"/>
    <rect x="150" y="400" width="54" height="90" fill="#3e705a"/>
  </g>
  <g>
    <rect x="808" y="300" width="140" height="200" fill="#d8c8ab"/>
    <rect x="818" y="310" width="120" height="178" fill="#2f4f3d"/>
    <rect x="824" y="316" width="50" height="80" fill="#3c6350"/>
    <rect x="882" y="316" width="50" height="80" fill="#3c6350"/>
    <rect x="824" y="404" width="50" height="78" fill="#3c6350"/>
    <rect x="882" y="404" width="50" height="78" fill="#3c6350"/>
  </g>

  <!-- sombrilla -->
  <g>
    <path d="M500 206 L500 300" stroke="#8d887c" stroke-width="10"/>
    <path d="M292 300 c0-116 94-176 208-176 s208 60 208 176 Z" fill="url(#vCloth)"/>
    <g fill="#b85a36" opacity=".9">
      <path d="M500 124 c34 0 64 6 90 20 l-90 156 Z"/>
      <path d="M500 124 c-34 0-64 6-90 20 l90 156 Z" opacity=".55"/>
    </g>
    <path d="M292 300 h416 c-10 20-26 28-46 28h-324 c-20 0-36-8-46-28 Z" fill="#e3d3b2"/>
    <ellipse cx="500" cy="352" rx="210" ry="42" fill="#16241c" opacity=".1"/>
  </g>

  <!-- mesas altas -->
  <g>
    <ellipse cx="330" cy="580" rx="120" ry="30" fill="#000" opacity=".1"/>
    <ellipse cx="330" cy="566" rx="116" ry="28" fill="url(#vWood)"/>
    <rect x="324" y="566" width="14" height="230" fill="#4f5a52"/>
    <ellipse cx="330" cy="796" rx="52" ry="12" fill="#4f5a52"/>
    <path d="M330 796 l-60 34 M330 796 l60 34" stroke="#4f5a52" stroke-width="10"/>
    <ellipse cx="266" cy="548" rx="18" ry="6" fill="#fdf8ee"/>
    <path d="M254 520 h24 l-4 24 h-16 Z" fill="#e8b64c"/>
    <rect x="246" y="428" width="26" height="112" rx="4" fill="#a4713c"/>
    <rect x="388" y="436" width="26" height="104" rx="4" fill="#a4713c"/>
  </g>
  <g>
    <ellipse cx="742" cy="612" rx="104" ry="26" fill="#000" opacity=".1"/>
    <ellipse cx="742" cy="600" rx="100" ry="24" fill="url(#vWood)"/>
    <rect x="737" y="600" width="12" height="196" fill="#4f5a52"/>
    <ellipse cx="742" cy="796" rx="46" ry="11" fill="#4f5a52"/>
    <path d="M742 796 l-52 30 M742 796 l52 30" stroke="#4f5a52" stroke-width="9"/>
    <ellipse cx="742" cy="588" rx="34" ry="10" fill="#fdf8ee"/>
    <ellipse cx="742" cy="584" rx="26" ry="7" fill="#e0cfa9"/>
  </g>

  <!-- taburetes -->
  <g fill="#8a5a2b">
    <ellipse cx="470" cy="704" rx="46" ry="14"/>
    <rect x="440" y="704" width="10" height="108"/>
    <rect x="492" y="704" width="10" height="108"/>
    <path d="M446 730 h52" stroke="#8a5a2b" stroke-width="8"/>
    <ellipse cx="598" cy="740" rx="46" ry="14"/>
    <rect x="568" y="740" width="10" height="96"/>
    <rect x="620" y="740" width="10" height="96"/>
    <path d="M574 764 h52" stroke="#8a5a2b" stroke-width="8"/>
  </g>

  <!-- suelo alicatado -->
  <rect x="0" y="816" width="1000" height="184" fill="url(#vFloor)"/>
  <g stroke="#bfad90" stroke-width="3" opacity=".8">
    <path d="M0 872 H1000 M0 928 H1000 M0 980 H1000"/>
    <path d="M140 816 V1000 M300 816 V1000 M460 816 V1000 M620 816 V1000 M780 816 V1000 M940 816 V1000 M220 872 V1000 M380 872 V1000 M540 872 V1000 M700 872 V1000 M860 872 V1000"/>
  </g>

  <!-- maceta -->
  <g>
    <path d="M120 980 c-24-52-12-104 22-134 0 54 2 96 12 134 Z" fill="url(#vLeaf)"/>
    <path d="M140 980 c18-56 56-86 96-84-30 34-44 58-46 84 Z" fill="#4f7d5a"/>
    <path d="M132 980 c-30-30-70-34-96-16 26 10 44 24 54 40 Z" fill="#3f6b4d"/>
    <path d="M100 972 h76 l-10 44 h-56 Z" fill="#b85a36"/>
    <rect x="96" y="962" width="84" height="16" rx="4" fill="#c96a43"/>
  </g>

  <rect width="1000" height="1000" fill="url(#vSun)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200">
  <defs>
    <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9dde3"/>
      <stop offset="1" stop-color="#f4eee1"/>
    </linearGradient>
    <linearGradient id="fWall" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset=".62" stop-color="#f5eddd"/>
      <stop offset="1" stop-color="#e2d4bc"/>
    </linearGradient>
    <linearGradient id="fDoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d4e28"/>
      <stop offset=".55" stop-color="#5c3a1c"/>
      <stop offset="1" stop-color="#452a14"/>
    </linearGradient>
    <linearGradient id="fGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd692"/>
      <stop offset="1" stop-color="#c98a3c"/>
    </linearGradient>
    <linearGradient id="fAwning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#ddcaa8"/>
    </linearGradient>
    <linearGradient id="fGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ded1ba"/>
      <stop offset="1" stop-color="#bfae93"/>
    </linearGradient>
    <radialGradient id="fGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd68c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd68c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16241c" stop-opacity=".26"/>
      <stop offset="1" stop-color="#16241c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fPot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c06a45"/>
      <stop offset="1" stop-color="#8f4527"/>
    </linearGradient>
  </defs>


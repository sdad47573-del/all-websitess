      búsqueda en Google.

      El 301 real lo genera el adapter de Vercel desde `redirects` en
      astro.config.mjs, pero su patrón solo cubre la URL sin barra final. Este
      fichero estático (que public se copia tal cual) cubre la variante con
      barra, que era la canónica del artículo antiguo y la que tiene indexada
      Google. Así ninguna de las dos formas devuelve un 404.

      Título y descripción propios: un noindex con el mismo <title> en los
      cuatro stubs duplicaba metadatos y dejaba la página sin description.
    -->
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="Este artículo se fusionó en si el Kit Digital merece la pena. Te llevamos al contenido actualizado."
    />

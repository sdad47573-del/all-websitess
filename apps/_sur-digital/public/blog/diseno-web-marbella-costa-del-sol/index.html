<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      Este artículo se fusionó en /blog/diseno-web-marbella/ para no competir
      por la misma búsqueda en Google.

      El 301 real lo genera el adapter de Vercel desde `redirects` en
      astro.config.mjs, pero su patrón solo cubre la URL sin barra final. Este
      fichero estático cubre la variante con barra, que era la canónica y la
      que Google tiene indexada. Así ninguna de las dos formas da 404.
    -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="/blog/diseno-web-marbella/" />
    <meta http-equiv="refresh" content="0; url=/blog/diseno-web-marbella/" />
    <title>Este artículo se ha fusionado | Sur Digital</title>
  </head>
  <body>
    <p>
      Este artículo se ha fusionado en
      <a href="/blog/diseno-web-marbella/"
        >diseño web en Marbella y Costa del Sol</a
      >.
    </p>
  </body>
</html>

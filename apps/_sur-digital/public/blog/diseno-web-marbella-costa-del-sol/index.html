<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      Este artículo se fusionó en /blog/diseno-web-marbella/ para no competir por la misma
      búsqueda en Google.

      El 301 real lo genera el adapter de Vercel desde `redirects` en
      astro.config.mjs, pero su patrón solo cubre la URL sin barra final. Este
      fichero estático (que public se copia tal cual) cubre la variante con
      barra, que era la canónica del artículo antiguo y la que tiene indexada
      Google. Así ninguna de las dos formas devuelve un 404.

      Título y descripción propios: un noindex con el mismo <title> en los
      cuatro stubs duplicaba metadatos y dejaba la página sin description.
    -->
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="Este artículo se fusionó en diseño web en Marbella. Te llevamos al contenido actualizado."
    />
    <link rel="canonical" href="/blog/diseno-web-marbella/" />
    <meta http-equiv="refresh" content="0; url=/blog/diseno-web-marbella/" />
    <title>Diseño web en Marbella: artículo actualizado | Sur Digital</title>
  </head>
  <body>
    <h1>Este artículo se ha fusionado</h1>
    <p>
      El contenido actualizado está en
      <a href="/blog/diseno-web-marbella/">diseño web en Marbella</a>.
    </p>
  </body>
</html>

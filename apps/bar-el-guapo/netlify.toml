# Configuración de Netlify (monorepo):
#   Base Directory:    la raiz del repositorio (sin tocar, es el valor por defecto).
#   Package Directory: apps/bar-el-guapo (Netlify lee este netlify.toml de ahi).
#
# El comando corre en la raiz, instala el workspace y compila solo esta app con turbo.
# `publish` es relativo a la raiz.

[build]
	command = "bun install --frozen-lockfile && bunx turbo run build --filter=bar-el-guapo"
	publish = "apps/bar-el-guapo/dist"

[build.environment]
	NODE_VERSION = "22"
